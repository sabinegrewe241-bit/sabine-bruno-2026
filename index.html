<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Sabine &amp; Bruno · Quer durch Europa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe7;--paper:rgba(255,255,255,.52);--ink:#17191a;--muted:#666864;--soft:#827d76;--line:rgba(64,56,48,.13);--accent:#b8933f;--accent2:#efe1b7;--sea:#dce8e8;--sea2:#bfd6d8;--glow:0 20px 60px rgba(34,31,29,.09);--serif:'Cormorant Garamond', Georgia, serif;--sans:'Inter', Arial, sans-serif;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:radial-gradient(circle at top left,#fffdf9 0,#f7f2ea 26%,#efe7dc 70%,#ebdfd2 100%);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 34%,transparent 70%,rgba(255,255,255,.14));mix-blend-mode:screen;z-index:0}
button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shell{position:relative;z-index:1;max-width:1640px;margin:0 auto;padding:22px clamp(16px,4vw,64px) 52px}

/* floating wave lines */
.wave-lines{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.42}
.wave-lines svg{width:100%;height:100%}
.wave-lines path{fill:none;stroke:rgba(156,188,191,.34);stroke-width:1.25}
.wave-lines path:nth-child(odd){animation:floatline 22s ease-in-out infinite}
.wave-lines path:nth-child(even){animation:floatline2 28s ease-in-out infinite}
@keyframes floatline{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes floatline2{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding:10px 0 26px;position:relative}
.eyebrow{font-size:13px;letter-spacing:.28em;text-transform:uppercase;font-weight:800;color:#887f76;margin-bottom:12px;line-height:1.55;animation:rise .95s ease both}.eyebrow .ey-main{display:block}.eyebrow .ey-date{display:block;letter-spacing:.22em;margin-top:4px}
.brandrow{display:flex;gap:18px;align-items:center;animation:rise 1.05s ease both}
.badge{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(134,108,89,.22);background:rgba(255,255,255,.44);backdrop-filter:blur(8px);box-shadow:0 10px 28px rgba(45,35,27,.05);font-family:var(--serif);font-size:40px;font-style:italic;letter-spacing:-.07em}
.brandtext{max-width:640px;font-size:15px;line-height:1.72;color:var(--muted)}
.langs{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.langs button{border:0;cursor:pointer;border-radius:999px;padding:18px 26px;background:rgba(255,255,255,.44);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(146,121,102,.14),0 10px 30px rgba(62,47,35,.04);font-size:28px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#92867b;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;min-width:94px}
.langs button:hover{transform:translateY(-2px)}
.langs button[aria-pressed=true]{color:var(--ink);background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(216,236,237,.7));box-shadow:inset 0 0 0 1px rgba(143,98,71,.24),0 16px 34px rgba(52,40,31,.07)}
.langs button[aria-pressed=true]::after{content:'';display:block;height:3px;margin-top:7px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:grow .6s ease}
.hero{display:grid;grid-template-columns:minmax(340px,1.05fr) minmax(320px,.98fr);gap:clamp(22px,4vw,54px);align-items:center;padding:8px 0 52px}
.copy h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(78px,8.5vw,154px);line-height:.84;letter-spacing:-.05em;text-wrap:balance;animation:rise 1.05s ease both}
.copy h1 em{font-style:italic;color:var(--accent);font-weight:500}
.intro{margin:18px 0 0;max-width:760px;font-size:clamp(22px,1.75vw,31px);line-height:1.66;color:#5b5a56;animation:rise 1.15s ease both}
.flair{display:grid;gap:4px;margin-top:26px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:#847b72;animation:rise 1.25s ease both}.flair span{display:block}.flair::before{display:none}
.gallery{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:stretch;animation:rise 1.15s ease both}
.feature{position:relative;min-height:710px;border-radius:40px;overflow:hidden;background:#d8d0c5;box-shadow:var(--glow)}
.feature img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.02);transition:transform .9s ease,opacity .45s ease}
.feature:hover img{transform:scale(1.055)}
.feature::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,11,12,.02),rgba(9,11,12,.09) 32%,rgba(9,11,12,.58));pointer-events:none}
.feature::before{content:'';position:absolute;left:-10%;right:-10%;bottom:-14%;height:30%;border-radius:60% 40% 0 0/100% 100% 0 0;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(220,236,237,.25) 28%,rgba(255,255,255,.08));z-index:1;animation:featureWave 10s ease-in-out infinite}
@keyframes featureWave{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5%)}}
.featurecap{position:absolute;left:34px;right:34px;bottom:28px;z-index:2;color:#fff;display:grid;gap:8px}
.featurecap .small{font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:800;opacity:.9}
.featurecap .title{font-family:var(--serif);font-weight:600;font-size:clamp(52px,5vw,82px);line-height:.88;letter-spacing:-.03em;text-wrap:balance}
.featurecap .sub{font-size:20px;line-height:1.48;color:rgba(255,255,255,.92);max-width:610px}
.picks{display:grid;gap:16px}
.pick{position:relative;border:0;cursor:pointer;text-align:left;padding:12px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;background:rgba(255,255,255,.46);backdrop-filter:blur(8px);border-radius:24px;box-shadow:inset 0 0 0 1px rgba(147,120,101,.12);transition:transform .25s ease,box-shadow .25s ease,background .25s ease;overflow:hidden}
.pick:hover{transform:translateX(-2px);box-shadow:inset 0 0 0 1px rgba(147,120,101,.18),0 16px 34px rgba(49,39,28,.06)}
.pick.active{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(219,237,239,.72));box-shadow:inset 0 0 0 1px rgba(143,98,71,.22),0 16px 34px rgba(49,39,28,.07)}
.pick.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.pick img{width:120px;height:124px;display:block;object-fit:cover;border-radius:16px}
.pick small{display:block;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#8b8278;font-weight:800;margin-bottom:7px}
.pick .ptitle{display:block;font-family:var(--serif);font-weight:600;font-size:38px;line-height:.82;letter-spacing:-.02em;margin-bottom:8px}
.pick .psub{display:block;font-size:16px;line-height:1.55;color:var(--muted)}
.wave-divider{position:relative;height:92px;margin:2px 0 18px}
.wave-divider svg{position:absolute;inset:0;width:100%;height:100%}
.wave-divider path{fill:rgba(215,233,234,.78)}
.wave-divider .stroke{fill:none;stroke:rgba(140,182,186,.38);stroke-width:2}
.routes-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:22px}
.routes-head h2{margin:0;font-family:var(--serif);font-size:clamp(62px,6.3vw,110px);line-height:.86;letter-spacing:-.05em;font-weight:600}
.routes-head h2 em{color:var(--accent);font-style:italic;font-weight:500}
.routes-helper{max-width:430px;text-align:right;font-size:18px;line-height:1.7;color:#615d57}
.routes{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.88fr);gap:22px;align-items:start}
.panel{background:rgba(255,255,255,.5);backdrop-filter:blur(8px);border-radius:36px;box-shadow:var(--glow);border:1px solid rgba(145,123,104,.12)}
.leftpanel{padding:24px}
.topline{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.routeheadline{display:grid;gap:8px}
.routeheadline .k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.routeheadline .r{font-family:var(--serif);font-weight:600;font-size:clamp(34px,3.4vw,58px);line-height:.9;letter-spacing:-.03em}
.routeheadline .m{font-size:17px;color:#5f5c56}
.nav{display:none}
.nav button{width:58px;height:58px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 1px rgba(145,123,104,.14);font-size:28px;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease}
.nav button:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(145,123,104,.18),0 10px 24px rgba(49,39,28,.08)}
.mapbox{position:relative;aspect-ratio:1200/700;background:linear-gradient(180deg,#dfe7e5,#d4e0df);border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(112,125,121,.09)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.water path{fill:none;stroke:rgba(255,255,255,.48);stroke-width:1.3}
.land path{fill:#f8f4ec;stroke:#c7d2cb;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.ghosts path{fill:none;stroke:rgba(118,128,120,.42);stroke-width:2.4;stroke-dasharray:4 11;stroke-linecap:round}
#routeShadow{fill:none;stroke:#fff8ef;stroke-width:12;stroke-linecap:round;opacity:.95}
#routeLine{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:10 10;filter:drop-shadow(0 2px 5px rgba(83,61,45,.14));animation:dash 2s linear infinite}
#routeLine.car{stroke:#587066;stroke-dasharray:5 10}
@keyframes dash{to{stroke-dashoffset:-42}}
.pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer;z-index:2}
.pin::before{content:'';position:absolute;inset:4px;border-radius:50%;background:rgba(143,98,71,.16);transform:scale(.6);opacity:0}
.pin.active::before{animation:pulse 1.9s ease infinite}
.pin .dot{width:18px;height:18px;border-radius:50%;background:#3c625b;border:4px solid #fff;box-shadow:0 0 0 1px rgba(58,79,73,.16),0 5px 14px rgba(58,79,73,.18);transition:transform .2s ease,background .2s ease}
.pin.active .dot{transform:scale(1.18);background:var(--accent)}
@keyframes pulse{0%{transform:scale(.65);opacity:.78}100%{transform:scale(1.75);opacity:0}}
.label{position:absolute;z-index:2;font-size:14px;font-weight:800;color:#314440;letter-spacing:.04em;line-height:1.15;text-shadow:0 1px 3px rgba(255,255,255,.95);white-space:nowrap}
.label span{display:block;font-size:12px;font-weight:600;color:#61726d;margin-top:4px}
.label.ali{left:6%;top:52%}.label.bre{left:40%;top:9%}.label.kre{left:61%;top:72%}.label.ant{left:80%;top:55%}
.rightpanel{padding:22px;display:grid;gap:18px}
.tabs{display:grid;grid-template-columns:1fr;gap:12px;overflow:visible;padding-bottom:0}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;cursor:pointer;background:#fff;padding:16px 18px;border-radius:20px;text-align:left;display:grid;gap:6px;min-width:0;box-shadow:inset 0 0 0 1px rgba(145,123,104,.12);transition:transform .22s ease,box-shadow .22s ease,background .22s ease}
.tab:hover{transform:translateY(-2px)}
.tab.active{background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(216,235,236,.82));box-shadow:inset 0 0 0 1px rgba(143,98,71,.22),0 12px 24px rgba(49,39,28,.06)}
.tab .t1{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#8a8278;font-weight:800}
.tab .t2{font-size:16px;font-weight:700}
.card{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,rgba(250,247,242,.96),rgba(255,255,255,.92));padding:26px;box-shadow:inset 0 0 0 1px rgba(145,123,104,.1)}
.card::after{content:'';position:absolute;left:-10%;right:-10%;bottom:-22%;height:38%;border-radius:60% 40% 0 0/100% 100% 0 0;background:linear-gradient(180deg,rgba(210,229,230,0),rgba(205,228,229,.34) 36%,rgba(255,255,255,.15));pointer-events:none;animation:cardWave 12s ease-in-out infinite}
@keyframes cardWave{0%,100%{transform:translateX(0)}50%{transform:translateX(3%)}}
.ck{font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:10px;position:relative;z-index:1}
.ct{margin:0 0 14px;font-family:var(--serif);font-weight:600;font-size:clamp(44px,3.1vw,60px);line-height:.9;letter-spacing:-.03em;position:relative;z-index:1}
.cm{display:flex;flex-wrap:wrap;gap:10px 14px;margin-bottom:18px;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgba(145,123,104,.12);font-size:14px;font-weight:700;color:#615b56}
.chip svg{width:18px;height:18px;fill:currentColor}
.cd{font-size:19px;line-height:1.78;color:#5f5a54;margin:0;position:relative;z-index:1}
.cq{margin-top:18px;padding:18px 20px;background:rgba(255,255,255,.72);border-left:3px solid rgba(143,98,71,.36);font-family:var(--serif);font-size:30px;line-height:1.18;font-style:italic;color:#6c5f53;position:relative;z-index:1}
.cf{margin-top:18px;font-size:14px;line-height:1.68;color:#877f76;position:relative;z-index:1}
.places-section{padding-top:26px}.places-section h3{margin:0 0 18px;font-family:var(--serif);font-weight:600;font-size:clamp(46px,4.2vw,76px);line-height:.9;letter-spacing:-.04em}.places-section h3 em{color:var(--accent);font-style:italic;font-weight:500}.places-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.place-card{padding:24px 24px 22px}.place-kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:10px}.place-title{font-family:var(--serif);font-size:40px;line-height:.9;font-weight:600;letter-spacing:-.03em;margin-bottom:14px}.place-copy{font-size:17px;line-height:1.8;color:#5f5a54}.place-copy p{margin:0 0 10px}.place-copy p:last-child{margin-bottom:0}@media(max-width:980px){.places-grid{grid-template-columns:1fr}.place-title{font-size:36px}}
.foot{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;padding-top:32px;color:#7d756d;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.foot b{color:#343331}
.fade{animation:fade .45s ease}@keyframes fade{from{opacity:.35;transform:scale(1.015)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleX(.55);opacity:.3}to{transform:scaleX(1);opacity:1}}
@media (max-width:1220px){.hero{grid-template-columns:1fr;gap:26px}.gallery{grid-template-columns:1fr}.feature{min-height:560px}.picks{grid-template-columns:repeat(2,minmax(0,1fr))}.routes{grid-template-columns:1fr}.routes-head{flex-direction:column;align-items:flex-start}.routes-helper{text-align:left}}
@media (max-width:760px){.shell{padding:14px 14px 36px}.top{flex-direction:column}.badge{width:60px;height:60px;font-size:32px}.langs{justify-content:flex-start}.langs button{font-size:20px;padding:15px 18px;min-width:78px}.copy h1{font-size:clamp(60px,15vw,88px)}.intro{font-size:18px}.gallery{gap:16px}.feature{min-height:430px;border-radius:28px}.featurecap{left:20px;right:20px;bottom:20px}.featurecap .title{font-size:46px}.featurecap .sub{font-size:16px}.picks{grid-template-columns:1fr}.pick{grid-template-columns:96px 1fr;padding:10px}.pick img{width:96px;height:96px}.pick .ptitle{font-size:30px}.routes-head h2,.places-section h3{font-size:52px}.routes-helper{font-size:16px}.panel{border-radius:28px}.leftpanel,.rightpanel,.place-card{padding:18px}.routeheadline .r{font-size:40px}.card{padding:20px}.ct{font-size:42px}.cd{font-size:17px}.cq{font-size:24px}.foot{font-size:11px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}html{scroll-behavior:auto}}

/* December: an unanswered destination, not a confirmed booking. */
.december{position:relative;isolation:isolate;overflow:hidden;margin-top:54px;min-height:345px;border-radius:38px;background:linear-gradient(127deg,#193b3f 0%,#244c53 44%,#112e39 100%);color:#fbf6ee;box-shadow:0 24px 62px rgba(20,47,55,.17);display:flex;align-items:center;padding:clamp(26px,4.7vw,70px)}
.december::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 78% 15%,rgba(138,192,192,.22),transparent 52%);z-index:-1}
.december svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.4;z-index:-1;overflow:visible}
.december svg path{fill:none;stroke:#d9eff0;stroke-width:2;vector-effect:non-scaling-stroke;animation:december-flow 15s ease-in-out infinite}
.december svg path:nth-child(even){stroke:#a7d5db;animation-duration:19s;animation-direction:reverse}
@keyframes december-flow{0%,100%{transform:translateX(-8px)}50%{transform:translateX(22px)}}
.december-inner{position:relative;z-index:1;max-width:1150px}
.december-kicker{font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:#c1dedf;font-weight:800;margin-bottom:20px}
.december-title{font-family:var(--serif);font-size:clamp(48px,6.6vw,112px);font-weight:600;line-height:.88;letter-spacing:-.045em;margin:0 0 27px;text-wrap:balance}
.december-choices{font-family:var(--serif);font-size:clamp(27px,3.4vw,55px);line-height:1.18;font-style:italic;font-weight:500;color:#f0d7be;letter-spacing:-.015em;max-width:1050px}
.december-tail{margin-top:26px;font-size:clamp(15px,1.2vw,19px);color:#d2e3e3;line-height:1.55;max-width:660px}
@media(max-width:760px){.december{border-radius:28px;margin-top:36px;min-height:340px;padding:30px 24px}.december-title{font-size:clamp(46px,13vw,73px)}.december-choices{font-size:clamp(27px,8vw,41px)}.december-tail{font-size:16px}.december-kicker{letter-spacing:.24em}}
@media(prefers-reduced-motion:reduce){.december svg path{animation:none}}

/* Interactive month rail: the three main chapters, always visible over the map */
.month-timeline{--step:0;position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 27px;padding:5px 0 0;isolation:isolate}
.month-timeline::before,.month-timeline::after{content:"";position:absolute;z-index:0;pointer-events:none;top:51px;left:16.6667%;height:2px;border-radius:99px}
.month-timeline::before{width:66.6667%;background:#d9d0c6}
.month-timeline::after{width:calc(66.6667% * var(--step) / 2);background:linear-gradient(90deg,#d7bd73,#f3ead0);transition:width .45s cubic-bezier(.2,.75,.2,1)}
.month-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:11px;min-width:0;padding:4px 2px 8px;border:0;background:transparent;cursor:pointer;color:#837c73;transition:color .25s ease}
.month-step .month-name{font-size:clamp(14px,1.15vw,19px);letter-spacing:.055em;font-weight:700;line-height:1.3;white-space:nowrap}
.month-step .month-dot{display:block;position:relative;width:20px;height:20px;border:5px solid #f7f3ee;border-radius:50%;background:#b0afa6;box-shadow:0 0 0 2px #d9d0c6;transition:background .3s ease,box-shadow .3s ease,transform .3s ease}
.month-step[aria-current="step"]{color:#252726}
.month-step[aria-current="step"] .month-name{font-weight:800}
.month-step[aria-current="step"] .month-dot{transform:scale(1.12);background:#f8f4ea;box-shadow:0 0 0 3px rgba(200,166,86,.44),0 0 0 12px rgba(233,211,155,.18);animation:month-breathe 2.2s ease-in-out infinite}
.month-step.past .month-dot{background:#a47d65;box-shadow:0 0 0 2px #d3b7a4}
.month-step:focus-visible{outline:2px solid #8f6247;outline-offset:3px;border-radius:14px}
.month-step:hover .month-name{color:#9d7a27}
@keyframes month-breathe{0%,100%{box-shadow:0 0 0 3px rgba(200,166,86,.42),0 0 0 12px rgba(233,211,155,.16)}50%{box-shadow:0 0 0 4px rgba(200,166,86,.50),0 0 0 18px rgba(233,211,155,.10)}}
@media(max-width:760px){.month-timeline{margin:0 0 19px}.month-timeline::before,.month-timeline::after{top:48px}.month-step{gap:11px;padding:3px 0 7px}.month-step .month-name{font-size:clamp(13px,3.6vw,17px);letter-spacing:0}.month-step .month-dot{width:18px;height:18px;border-width:4px}}
@media(prefers-reduced-motion:reduce){.month-step[aria-current="step"] .month-dot{animation:none}}

:root{--bg:#f7f3e9;--accent:#af822e;--accent2:#ecd394}
body{background:radial-gradient(circle at 8% 3%,#fffdf8 0%,#f7f2e6 44%,#eee8d7 100%)}

.routeheadline{min-width:0;width:100%}

/* A restrained gold interactive timeline. */
.month-step[aria-current=step] .month-name{color:#987027}
.month-step[aria-current=step] .month-dot{background:#fffaf0;border-color:#e5d5ac;animation:timelineGold 2.5s ease-in-out infinite}
.month-step.past .month-dot{background:#c4ad78;box-shadow:0 0 0 2px #decda1}
@keyframes timelineGold{0%,100%{transform:scale(1.0);box-shadow:0 0 0 4px rgba(180,136,47,.29),0 0 0 12px rgba(244,221,158,.10),0 0 13px #e1bd68}50%{transform:scale(1.14);box-shadow:0 0 0 5px rgba(180,136,47,.35),0 0 0 19px rgba(244,221,158,.17),0 0 24px #deba62}}
.month-timeline::before{background:#e3d9c4}
.month-timeline::after{background:linear-gradient(90deg,#bc9550,#f2dfb1)}
/* Few generous controls, with soft pulse instead of flashing. */
.route-cluster.active{border-color:rgba(171,128,48,.55);background:linear-gradient(125deg,#fffefb,#f8efd9);animation:goldCluster 3.4s ease-in-out infinite}
@keyframes goldCluster{0%,100%{box-shadow:0 0 0 1px rgba(185,140,59,.15),0 10px 30px rgba(123,98,58,.09)}50%{box-shadow:0 0 0 3px rgba(185,140,59,.22),0 12px 34px rgba(171,134,70,.17)}}

.rightpanel{gap:14px}

.route-note .cd{font-size:16px;line-height:1.65;color:#746b5a}

.mapbox{background:linear-gradient(180deg,#d7e5df,#cbdedb)}
.mapbox .land-real{fill:#f7f5ef;stroke:#b5c7c0}
.travel-shadow{fill:none;stroke:#fffefa;stroke-width:6.2;opacity:.94;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 2px rgba(92,72,39,.2));}
.travel-flight,.travel-car{fill:none;stroke-width:2.9;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 12;marker-end:none!important;animation:travelShimmer 2.9s ease-in-out infinite;filter:drop-shadow(0 0 2.5px rgba(136,100,36,.3));}
.travel-flight{stroke:#b17d21;stroke-dashoffset:0}
.travel-car{stroke:#457e85;stroke-dasharray:5 9;stroke-dashoffset:0;animation-duration:3s;filter:drop-shadow(0 0 2px rgba(44,107,115,.24));}
.travel-shadow.is-dim,.travel-flight.is-dim,.travel-car.is-dim{opacity:.28;filter:none}

  de:{eyebrow:"<span class='ey-main'>Sabine & Bruno</span><span class='ey-date'>August bis Oktober 2026</span>",brand:"Finestrat · Bremen · Kreta · Antalya",title:"Vier Orte. <em>Sieben Wege.</em>",intro:"Verfolge unten unsere Route und die einzelnen Etappen dieser Reise.",flair:"<span>Wellen-Edition</span><span>Luxusreise-Moodboard</span>",rtitle:"Unsere <em>Reisewege.</em>",rhelper:"Tippe auf einen Monat, um die Route anzuzeigen.",routek:"Ausgewählte Etappe",foot:"Flugstrecken = Luftlinie · SLK = ungefährer Straßenweg",quote:"Vier Orte. Sieben Wege. Drei Monate zwischen Küste, Stadt und Süden.",footleft:"",footright:"August – Oktober 2026",mode:{flight:"Flug",car:"SLK · Auto"},moment:["Anfang August","Mitte September","Mitte September","Mitte Oktober","Sabine zurück","Bruno weiter","Bruno mit dem SLK"],months:{aug:"August",sep:"September",oct:"Oktober"},names:{ali:"Finestrat / Alicante",bre:"Bremen",kre:"Kreta",ant:"Antalya"},photos:{ali:{small:"Costa Blanca · Spanien",title:"Finestrat",sub:"Nahe Alicante und Benidorm, an der spanischen Costa Blanca, beginnt die Reise. Berge, Meer und dieses klare Mittelmeerlicht machen den Ort zu einem sehr besonderen Ausgangspunkt."},bre:{small:"Weser · 3. Oktober",title:"Bremen",sub:"Stadt am Fluss, eingehüllt in Lichtatmosphäre: Bremen zeigt sich an einem besonderen Tag, dem Tag der Deutschen Einheit, beinahe wie eine kleine Filmkulisse am Wasser."},kre:{small:"Süden Kretas",title:"Kreta",sub:"Gebucht wurde das Hotel wegen seiner Bar – nur um vor Ort zu erfahren, dass sie seit acht Jahren geschlossen ist. Brunos Enttäuschung war groß, der Pool dafür fotogen genug, um die Geschichte mit etwas Humor zu erzählen."},ant:{small:"Resort bei Nacht",title:"Antalya",sub:"Antalya bringt noch einmal Größe ins Spiel: warme Nacht, leuchtende Architektur und das Gefühl, dass der Sommer im Süden einfach länger bleibt als anderswo."}},desc:["Der erste Weg führt Anfang August von Finestrat nach Bremen – vom mediterranen Ausgangspunkt zurück in den Norden Deutschlands.","Von Bremen geht es Mitte September weiter nach Kreta. Die Route führt erneut ans Wasser, diesmal auf eine große Mittelmeerinsel.","Mitte September führt der Rückflug von Kreta zurück nach Bremen – der Bogen schließt sich vorübergehend.","Mitte Oktober startet die nächste Etappe von Bremen nach Antalya. Die Reise wird wieder international und deutlich weiter südöstlich.","Von Antalya reist Sabine zurück nach Bremen – direkt, klar und ohne Umweg.","Bruno fliegt direkt von Antalya nach Alicante – nicht für einen weiteren Urlaub, sondern um den SLK nach Deutschland zu bringen.","Von Alicante bringt Bruno den SLK auf dem Landweg nach Deutschland und fährt damit bis Bremen."],placesTitle:"Die Orte <em>greifbar machen.</em>",placesHelper:"Kurze Leseeindrücke für internationale Leserinnen und Leser – damit Finestrat, Bremen, Kreta und Antalya nicht nur Namen auf einer Karte bleiben.",places:[{kicker:"Costa Blanca",title:"Finestrat",copy:["Finestrat liegt nahe Alicante und Benidorm an der spanischen Costa Blanca und verbindet Küstenlicht mit Bergkulisse.","Wer den Ort nicht kennt, sollte sich einen ruhigeren Gegenpol zum lebhaften Benidorm vorstellen.","Die Farben sind oft glasklar: Blau vom Meer, helles Gestein, trockene Hänge und dazwischen sattes Grün aus den bewässerten Zonen.","Neben Bergen und Küstenorten prägen auch Landwirtschaft und bewässerte Anbauflächen Teile der Region.","Trotzdem bleibt das Lebensgefühl mediterran und leicht, besonders am Abend, wenn das Licht weicher wird.","Finestrat ist kein lauter Sehnsuchtsort, sondern eher ein Ort der Zwischenstimmung – genau das macht ihn so interessant.","Als Ausgangspunkt dieser Reise erzählt er sofort von Süden, Weite und einem Alltag in Meernähe."]},{kicker:"Stadt am Fluss",title:"Bremen",copy:["Bremen liegt an der Weser und ist eine Hansestadt, die Wasser, Geschichte und Gegenwart auf eine stille Art zusammenbringt.","Bremen ist deutlich kleiner als Berlin oder Hamburg. Gerade das macht die Hansestadt so charmant: überschaubar, persönlich und mit einer ganz eigenen Atmosphäre.","Die Uferzonen und die Lichter am Wasser geben der Stadt am Abend eine fast filmische Atmosphäre.","Der gezeigte Moment fällt auf einen besonderen Tag, den Tag der Deutschen Einheit am 3. Oktober.","Das verleiht dem Bild noch eine zusätzliche emotionale Ebene, weil die Stadt nicht nur schön, sondern auch symbolisch aufgeladen wirkt.","Bremen ist keine laute Metropole, sondern eine Stadt, die eher über Stimmung als über Größe funktioniert.","Gerade deshalb bleibt sie als Zuhause im Verlauf der Reise so glaubwürdig und greifbar."]},{kicker:"Mittelmeerinsel",title:"Kreta",copy:["Kreta ist die größte griechische Insel und im Süden oft rauer, sonnenhärter und ursprünglicher, als viele es erwarten.","Unser Weg führte in den Süden der Insel: Olivenhaine, Gewächshäuser und weite, trockene Flächen prägten das Bild – fernab vom üblichen Postkartenkitsch.","Von Spanien aus betrachtet, erinnert manches sogar an große Agrarlandschaften, nur mit griechischem Rhythmus und Mittelmeerwind.","Und selbst wenn sonst einmal wenig los ist: Eine Taverne scheint man in Griechenland immer zu finden.","Besonders hübsch wirkt im Osten Agios Nikolaos, eine Stadt, die Wasser, Promenade und Inselgefühl sehr elegant verbindet.","Die Hotelbar dieser Reise blieb zwar seit acht Jahren geschlossen, doch genau solche kleinen Enttäuschungen machen Erinnerungen oft erst erzählbar.","So wird Kreta hier nicht nur als schönes Bild, sondern als Ort mit Charakter, Trockenheit, Humor und sehr eigener Atmosphäre spürbar."]},{kicker:"Türkische Riviera",title:"Antalya",copy:["Antalya steht für die türkische Riviera – für große Hotels, warme Nächte und eine Reisekultur, die mediterran und orientalisch zugleich wirkt.","Viele kennen den Namen, aber nicht jeder weiß, wie stark Licht und Architektur hier auf Inszenierung setzen.","Gerade abends entstehen diese Bilder aus Reflexionen, beleuchteten Fassaden und Wasserflächen, die fast wie Bühnenräume wirken.","Die Stadt selbst verbindet Altstadt, Hafen und modernes Ferienleben, während die Küste ringsum den Blick immer wieder ans Meer zieht.","Im Vergleich zu Bremen oder Finestrat fühlt sich Antalya größer, opulenter und unmittelbarer touristisch an.","Genau dadurch setzt dieser Ort im Reiseverlauf noch einmal einen ganz anderen Akzent.","Als spätere Station bringt Antalya Größe, Wärme und einen Hauch von Finale in die Geschichte."]}]},
  en:{eyebrow:"<span class='ey-main'>Sabine & Bruno</span><span class='ey-date'>August to October 2026</span>",brand:"Finestrat · Bremen · Crete · Antalya",title:"Four places. <em>Seven routes.</em>",intro:"After the last months in Finestrat, we returned to Bremen in early August. We then travelled to Crete and Antalya. After that our routes parted: Sabine flew from Antalya to Bremen. Bruno flew directly from Antalya to Alicante so he could bring the SLK back to Germany.",flair:"<span>Wave Edition</span><span>Luxury Travel Moodboard</span>",rtitle:"Our <em>travel routes.</em>",rhelper:"Choose a route and follow the stages from August to October. The lines on the map gently pulse so the movements stay easy to read.",routek:"Selected stage",foot:"Flight distances = straight line · SLK = approximate road distance",quote:"Four places. Seven routes. Three months between coast, city and southern light.",footleft:"",footright:"August – October 2026",mode:{flight:"Flight",car:"SLK · Car"},moment:["Early August","Mid September","Mid September","Mid October","Sabine returns","Bruno continues","Bruno in the SLK"],months:{aug:"August",sep:"September",oct:"October"},names:{ali:"Finestrat / Alicante",bre:"Bremen",kre:"Crete",ant:"Antalya"},photos:{ali:{small:"Costa Blanca · Spain",title:"Finestrat",sub:"Near Alicante and Benidorm on Spain’s Costa Blanca, the journey begins. Mountains, sea and that bright Mediterranean light make it a striking point of departure."},bre:{small:"River Weser · 3 October",title:"Bremen",sub:"A city by the river wrapped in light: Bremen appears on a special day, German Unity Day, almost like a cinematic waterfront set."},kre:{small:"Southern Crete",title:"Crete",sub:"The hotel was booked because of its bar – only to discover on arrival that it had been closed for eight years. Bruno’s disappointment was considerable, but at least the pool was photogenic enough to turn the story into a joke."},ant:{small:"Resort at night",title:"Antalya",sub:"Antalya adds scale again: warm night air, illuminated architecture and the feeling that summer simply lasts longer in the south."}},desc:["The first leg takes the journey from Finestrat back to Bremen in early August – from a Mediterranean starting point to northern Germany.","From Bremen the route continues to Crete in mid September. The journey heads back to the water, this time on a large Mediterranean island.","In mid September the return flight from Crete leads back to Bremen – the arc closes for a while.","In mid October the next leg starts from Bremen to Antalya. The journey becomes international again and moves further south-east.","From Antalya, Sabine returns directly to Bremen – simple, clear and direct.","Bruno flies directly from Antalya to Alicante – not for another holiday, but to bring the SLK back to Germany.","From Alicante, Bruno brings the SLK back to Germany by road, driving all the way to Bremen."],placesTitle:"Making the <em>places tangible.</em>",placesHelper:"Short reading notes for international readers, so Finestrat, Bremen, Crete and Antalya feel like real places rather than names on a map.",places:[{kicker:"Costa Blanca",title:"Finestrat",copy:["Finestrat lies near Alicante and Benidorm on Spain’s Costa Blanca, where mountain scenery meets the Mediterranean coast.","For anyone unfamiliar with it, imagine a calmer counterpart to lively Benidorm.","The palette is often crystal clear: blue sea, pale rock, dry hills and irrigated green areas in between.","Alongside the mountains and coastal towns, farming and irrigated fields shape parts of the landscape.","And yet the atmosphere still feels light and Mediterranean, especially in the evening when the light softens.","Finestrat is not a loud dream destination; it is more a place of in-between moods, which is exactly what makes it interesting.","As the starting point of the journey, it immediately suggests southern light, openness and everyday life near the sea."]},{kicker:"City by the river",title:"Bremen",copy:["Bremen sits on the River Weser and is a Hanseatic city where water, history and the present meet in a quiet but memorable way.","Bremen is much smaller than Berlin or Hamburg. That is part of its charm: a welcoming, easy-to-explore Hanseatic city with an atmosphere all its own.","The waterfront areas and the reflections at night give the city an almost cinematic atmosphere.","The moment shown here falls on German Unity Day, 3 October, which adds another emotional layer.","That makes the city feel not only beautiful, but also symbolically charged.","Bremen is not a loud metropolis; it works more through mood than sheer scale.","That is exactly why it remains such a believable and tangible home base within the wider journey."]},{kicker:"Mediterranean island",title:"Crete",copy:["Crete is Greece’s largest island and, in the south, often rougher, drier and more elemental than visitors expect.","Our route led into the south of the island: olive groves, greenhouses and expanses of dry land shaped the view – far from the usual postcard clichés.","Seen from Spain, some of it even recalls large agricultural areas, only with a Greek rhythm and Mediterranean wind.","And even if there is not much else around, a taverna somehow always seems to appear in Greece.","In the east, Agios Nikolaos is among the island’s prettiest towns, combining water, promenade and island character with real elegance.","The hotel bar on this trip had been closed for eight years, but those small disappointments are often what make memories worth telling.","So Crete appears here not just as a pretty image, but as a place with character, dryness, humour and a very distinct atmosphere."]},{kicker:"Turkish Riviera",title:"Antalya",copy:["Antalya stands for the Turkish Riviera: large hotels, warm nights and a travel culture that feels both Mediterranean and faintly oriental.","Many people know the name, but not everyone realises how much the city plays with light and architectural staging.","Especially after dark, reflections, illuminated facades and water surfaces create scenes that feel almost theatrical.","The city itself combines old town, harbour and modern holiday life, while the coastline constantly pulls the eye back to the sea.","Compared with Bremen or Finestrat, Antalya feels bigger, more opulent and more immediately touristic.","That contrast gives the journey another register and another temperature.","As a later stop, Antalya adds warmth, scale and a sense of finale to the story."]}]},
  es:{eyebrow:"<span class='ey-main'>Sabine & Bruno</span><span class='ey-date'>Agosto a octubre de 2026</span>",brand:"Finestrat · Bremen · Creta · Antalya",title:"Cuatro lugares. <em>Siete rutas.</em>",intro:"Tras los últimos meses en Finestrat, regresamos a Bremen a principios de agosto. Después viajamos a Creta y Antalya. Después se separaron nuestros caminos: Sabine voló de Antalya a Bremen. Bruno voló directamente de Antalya a Alicante para llevar después el SLK a Alemania.",flair:"<span>Edición Ola</span><span>Moodboard de viaje de lujo</span>",rtitle:"Nuestras <em>rutas de viaje.</em>",rhelper:"Selecciona una ruta y sigue las etapas de agosto a octubre. Las líneas del mapa laten suavemente para que el recorrido se lea mejor.",routek:"Etapa seleccionada",foot:"Vuelos = distancia en línea recta · SLK = distancia aproximada por carretera",quote:"Cuatro lugares. Siete rutas. Tres meses entre costa, ciudad y luz del sur.",footleft:"",footright:"Agosto – octubre de 2026",mode:{flight:"Vuelo",car:"SLK · Coche"},moment:["Principios de agosto","Mediados de septiembre","Mediados de septiembre","Mediados de octubre","Sabine regresa","Bruno continúa","Bruno en el SLK"],months:{aug:"Agosto",sep:"Septiembre",oct:"Octubre"},names:{ali:"Finestrat / Alicante",bre:"Bremen",kre:"Creta",ant:"Antalya"},photos:{ali:{small:"Costa Blanca · España",title:"Finestrat",sub:"Cerca de Alicante y Benidorm, en la Costa Blanca española, comienza el viaje. Montañas, mar y una luz mediterránea muy limpia convierten el lugar en un punto de partida muy especial."},bre:{small:"Río Weser · 3 de octubre",title:"Bremen",sub:"Ciudad junto al río, envuelta en una atmósfera de luz: Bremen aparece en un día especial, el Día de la Unidad Alemana, casi como un decorado cinematográfico sobre el agua."},kre:{small:"Sur de Creta",title:"Creta",sub:"El hotel se reservó por su bar, solo para descubrir al llegar que llevaba ocho años cerrado. La decepción de Bruno fue grande, aunque por lo menos la piscina seguía siendo lo bastante fotogénica como para tomárselo con humor."},ant:{small:"Resort de noche",title:"Antalya",sub:"Antalya vuelve a aportar escala: noche cálida, arquitectura iluminada y la sensación de que el verano en el sur simplemente dura más."}},desc:["La primera etapa lleva el viaje de Finestrat a Bremen a principios de agosto: desde un punto de partida mediterráneo hacia el norte de Alemania.","Desde Bremen, la ruta continúa hacia Creta a mediados de septiembre. El viaje vuelve al agua, esta vez en una gran isla mediterránea.","A mediados de septiembre, el vuelo de regreso desde Creta conduce otra vez a Bremen: el arco se cierra por un tiempo.","A mediados de octubre empieza la siguiente etapa de Bremen a Antalya. El viaje vuelve a ser internacional y se desplaza más al sureste.","Desde Antalya, Sabine regresa directamente a Bremen: de forma clara y sin rodeos.","Bruno vuela directamente de Antalya a Alicante, no para seguir de vacaciones, sino para llevar el SLK a Alemania.","Desde Alicante, Bruno lleva el SLK por carretera hasta Alemania y continúa hasta Bremen."],placesTitle:"Hacer los <em>lugares tangibles.</em>",placesHelper:"Pequeñas notas de lectura para lectores internacionales, para que Finestrat, Bremen, Creta y Antalya sean algo más que nombres en un mapa.",places:[{kicker:"Costa Blanca",title:"Finestrat",copy:["Finestrat está cerca de Alicante y Benidorm, en la Costa Blanca española, donde el paisaje de montaña se encuentra con la costa mediterránea.","Para quien no lo conozca, puede imaginarse como una versión más tranquila del animado Benidorm.","La paleta suele ser limpísima: azul del mar, roca clara, laderas secas y zonas verdes irrigadas entre medias.","Además de las montañas y las localidades costeras, la agricultura y los campos de regadío forman parte del paisaje.","Aun así, la sensación sigue siendo ligera y mediterránea, sobre todo al atardecer, cuando la luz se suaviza.","Finestrat no es un destino ruidoso, sino más bien un lugar de matices intermedios, y precisamente ahí está su interés.","Como punto de partida del viaje, habla enseguida de luz del sur, amplitud y una vida cotidiana cerca del mar."]},{kicker:"Ciudad junto al río",title:"Bremen",copy:["Bremen está situada a orillas del Weser y es una ciudad hanseática donde el agua, la historia y el presente conviven de manera serena.","Bremen es mucho más pequeña que Berlín o Hamburgo. Y ahí reside parte de su encanto: una ciudad hanseática acogedora, cercana y con un ambiente muy especial.","Las zonas junto al río y los reflejos nocturnos le dan a la ciudad una atmósfera casi cinematográfica.","El momento mostrado aquí coincide con el Día de la Unidad Alemana, el 3 de octubre, lo que añade una capa emocional adicional.","Así, la ciudad no solo resulta bella, sino también simbólicamente cargada.","Bremen no es una metrópoli estridente; funciona más por su clima y su tono que por su tamaño.","Precisamente por eso resulta un hogar tan creíble y tan tangible dentro del conjunto del viaje."]},{kicker:"Isla mediterránea",title:"Creta",copy:["Creta es la isla más grande de Grecia y, en el sur, suele ser más áspera, más seca y más elemental de lo que muchos esperan.","Nuestro camino nos llevó al sur de la isla: olivares, invernaderos y grandes extensiones secas, lejos de las típicas postales turísticas.","Vista desde España, parte del entorno incluso recuerda a grandes áreas agrícolas, solo que con ritmo griego y viento mediterráneo.","Y aunque no haya mucho más alrededor, una taberna parece aparecer siempre en Grecia.","En el este, Agios Nikolaos está entre las ciudades más bonitas de la isla, combinando agua, paseo marítimo y carácter isleño con mucha elegancia.","El bar del hotel de este viaje llevaba ocho años cerrado, pero esas pequeñas decepciones son a menudo las que convierten un recuerdo en una buena historia.","Así, Creta no aparece aquí solo como una imagen bonita, sino como un lugar con carácter, sequedad, humor y una atmósfera muy propia."]},{kicker:"Riviera turca",title:"Antalya",copy:["Antalya representa la Riviera turca: grandes hoteles, noches cálidas y una cultura de viaje que se siente a la vez mediterránea y ligeramente oriental.","Mucha gente conoce el nombre, pero no todos perciben hasta qué punto la ciudad trabaja con la luz y la puesta en escena arquitectónica.","Sobre todo por la noche, los reflejos, las fachadas iluminadas y las superficies de agua crean escenas casi teatrales.","La ciudad combina casco antiguo, puerto y vida vacacional moderna, mientras la costa devuelve constantemente la mirada al mar.","Comparada con Bremen o Finestrat, Antalya se siente más grande, más opulenta y más directamente turística.","Ese contraste aporta otro registro y otra temperatura al viaje.","Como etapa posterior, Antalya añade calor, escala y una cierta sensación de final a la historia."]}]}

COPY.de.places[3].copy=[
 "Unser Aufenthaltsort liegt bei Okurcalar an der türkischen Riviera, nicht direkt in Antalya, sondern nahe Alanya.",
 "Die Gegend ist geprägt von langen Küstenabschnitten, großen Hotelanlagen und warmen Abenden am Mittelmeer.",
 "Tagsüber mischen sich Strand, Sonne und Poolleben; am Abend verwandeln Licht und Spiegelungen die Anlagen in eine kleine Bühne.",
 "Alanya selbst ist bekannt für seine Burg über der Küste und das Zusammenspiel aus Meer, Hafen und lebhaftem Stadtleben.",
 "Im Vergleich zum stilleren Finestrat wirkt die Ferienregion größer und geschäftiger, aber die Nähe zum Wasser verbindet beide Orte.",
 "Auf unserer Reise ist dieser südliche Abschnitt zugleich der Punkt, an dem sich die Wege von Sabine und Bruno trennen."
];
COPY.en.places[3].copy=[
 "We stayed around Okurcalar on the Turkish Riviera, not in Antalya city itself, but near Alanya.",
 "This stretch of coast is known for its long shoreline, large resorts and warm Mediterranean evenings.",
 "By day it is all beach, sun and pools; by night, lights and reflections give the buildings a theatrical glow.",
 "Alanya itself is recognisable by its hilltop castle, harbour and lively coastal atmosphere.",
 "Compared with quieter Finestrat, the holiday region feels bigger and busier, yet the water links both places.",
 "In our journey this southern stop is also where Sabine's and Bruno's routes part."
];
COPY.es.places[3].copy=[
 "Nos alojamos por Okurcalar, en la Riviera turca, no en la ciudad de Antalya, sino cerca de Alanya.",
 "Esta costa se caracteriza por largos tramos de playa, grandes complejos turísticos y noches cálidas frente al Mediterráneo.",
 "De día hay sol, playa y piscina; de noche, las luces y los reflejos convierten los edificios en un pequeño escenario.",
 "Alanya destaca por su castillo sobre la costa, su puerto y su ambiente animado.",
 "Frente al Finestrat más tranquilo, esta zona parece mayor y más bulliciosa, aunque el mar une los dos lugares.",
 "En nuestro viaje, esta parada del sur es también donde se separan las rutas de Sabine y Bruno."
];

function photoSet(key){
 photo=key;const c=COPY[lang].photos[key],im=$('fimg');
 const feature=$('galleryFeature');
 const backdrop=$('galleryBlur');
 $('fsmall').textContent=c.small;$('ftitle').textContent=c.title;$('fsub').textContent=c.sub;
 document.querySelectorAll('.pick').forEach(b=>{const selected=b.dataset.key===key;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));});
 $('galleryDots').innerHTML=PHOTO_ORDER.map(k=>'<i'+(k===key?' class="active"':'')+'></i>').join('');
 const applyImage=()=>{
   feature.classList.toggle('photo-ali',key==='ali');
   if(key==='ali'){backdrop.src=IMAGES.ali;}else{backdrop.removeAttribute('src');}
   im.src=IMAGES[key];
   im.alt=c.title;
   requestAnimationFrame(()=>im.classList.remove('is-fading'));
 };
 const currentSrc=im.getAttribute('src')||'';
 const nextSrc=IMAGES[key];
 if(currentSrc===nextSrc){
   feature.classList.toggle('photo-ali',key==='ali');
   if(key==='ali'){backdrop.src=IMAGES.ali;}else{backdrop.removeAttribute('src');}
   im.alt=c.title;
   im.classList.remove('is-fading');
   return;
 }
 im.classList.add('is-fading');
 const loader=new Image();
 let applied=false;
 const finish=()=>{if(applied)return;applied=true;setTimeout(applyImage,240);};
 loader.onload=finish;
 loader.onerror=finish;
 loader.src=nextSrc;
 if(loader.complete){finish();}
}

function pathFor(i){return PATHS[i];}
function renderRoutes(){
 const g=$('activeRoutes');g.replaceChildren();
 // One physical line per connection. September's return, and Sabine's
 // October return, run on the very same lines – never draw them twice.
 const activeIndices=activeMonth==='aug'?[0]:activeMonth==='sep'?[1]:[3,5,6];
 const emphasized=new Set(activeMonth!=='oct' ? activeIndices :
   activeBranch==='sabine' ? [3] : activeBranch==='bruno' ? [5,6] : [3,5,6]);
 for(const i of activeIndices){
   const isDim=!emphasized.has(i);
   const white=document.createElementNS('http://www.w3.org/2000/svg','path');
   white.setAttribute('d',pathFor(i));
   white.setAttribute('class','travel-shadow'+(isDim?' is-dim':''));
   g.appendChild(white);
   const line=document.createElementNS('http://www.w3.org/2000/svg','path');
   line.setAttribute('d',pathFor(i));
   line.setAttribute('class',(i===6?'travel-car':'travel-flight')+(isDim?' is-dim':''));
   line.style.animationDelay=`${(i%3)*-.35}s`;
   g.appendChild(line);
 }
 const cities=new Set();emphasized.forEach(i=>{cities.add(LEGS[i][0]);cities.add(LEGS[i][1]);});
 document.querySelectorAll('.pin').forEach(p=>{
   const active=cities.has(p.dataset.pin);
   p.classList.toggle('active',active);
   p.classList.toggle('highlight-oct',activeMonth==='oct'&&activeBranch!=='sabine'&&p.dataset.pin==='ali');
 });
}
